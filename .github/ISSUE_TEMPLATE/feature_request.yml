name: Feature Request
description: Suggest a new audio feature, DSP improvement, USB DAC capability, or UI enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Feature Area
      options:
        - Audio Engine / USB DAC / DSD
        - EQ & 64-Bit DSP
        - UI / UX & Themes
        - Library, Queue & Lyrics
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve, or why would this be useful?
      placeholder: As a USB DAC user, I want...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working in Hiresia.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context (Optional)
      description: Any screenshots, references, or technical notes.

